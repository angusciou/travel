<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#d97706">

<script>

window.SUPABASE_CONFIG = { url: 'https://ihjvmuagdzjewspuydsu.supabase.co', key: 'sb_publishable_C_NUZLfd14gwE-mSsxBUqA_WrbY3s4Y' };
</script>
<style type="text/tailwindcss">
  body{font-family:'Noto Sans TC',sans-serif;-webkit-tap-highlight-color:transparent;background-color:#f8fafc;color:#1e293b}

<body class="h-full bg-slate-50 text-slate-800 text-xs flex flex-col justify-between overflow-x-hidden">

<header class="relative z-30 bg-white border-b border-slate-200 px-3 py-2.5 text-slate-800 flex items-center justify-between shadow-sm flex-shrink-0">
  <div class="flex items-center space-x-2 min-w-0 cursor-pointer" onclick="goHome()">
    <div class="bg-amber-500 text-white w-7 h-7 rounded-lg flex items-center justify-center font-bold text-sm shadow-sm flex-shrink-0"><i class="fa-solid fa-wallet"></i></div>
    <div class="min-w-0"><h1 id="h-title" class="text-xs font-bold truncate text-slate-900">帳本</h1><p id="h-sub" class="text-[9px] text-slate-500">點擊返回首頁</p></div>
  </div>
  <div class="flex items-center gap-1.5 flex-shrink-0 text-xs">
  <button id="h-install" onclick="installApp()" class="hidden bg-amber-500 hover:bg-amber-600 text-white px-2 py-1 rounded-lg font-bold shadow-sm"><i class="fa-solid fa-download mr-1"></i>安裝</button>
  <div id="h-btns" class="hidden items-center gap-1.5 flex-shrink-0 text-xs">
    <button onclick="goHome()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded-lg border border-slate-200 font-bold"><i class="fa-solid fa-house text-amber-600 mr-1"></i>首頁</button>
    <button onclick="acctModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-1.5 rounded-lg border border-slate-200 relative" title="帳號"><i class="fa-solid fa-user-circle text-emerald-600"></i><span class="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-emerald-500"></span></button>
  </div>
  </div>
</header>

<main class="relative z-20 flex-1 flex flex-col p-3 overflow-y-auto max-w-md mx-auto w-full pb-24"><div id="app" class="flex-1 flex flex-col space-y-3 pb-4"></div></main>

<nav id="nav" class="hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 px-3 py-2 flex items-center justify-around text-slate-400 shadow-lg"></nav>

<div id="modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
  <div id="sheet" class="bg-white rounded-2xl max-w-sm w-full p-4 shadow-xl relative text-xs max-h-[90vh] overflow-y-auto"></div>
</div>
<div id="toast" class="fixed top-3 left-1/2 -translate-x-1/2 z-[60] text-xs px-3 py-2 rounded-lg text-white shadow-lg hidden"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS = {food:'🍜 餐飲美食', transport:'✈️ 交通運具', hotel:'🏨 住宿旅館', tickets:'🎫 門票娛樂', shopping:'🛍️ 購物伴手禮', other:'📦 其它雜項'};
const MODES = {normal:'均分模式 (付款人也參與分攤)', payer_excluded:'代墊模式 (付款人不需付錢，僅分攤人還款)', self:'自行付款 (付款人自己負擔，不產生欠款)'};
const MODE_SHORT = {normal:'均分', payer_excluded:'代墊', self:'自付'};
const COLORS = ['#10b981', '#f59e0b', '#3b82f6', '#ec4899', '#8b5cf6', '#64748b'];
const BUCKET = 'ledger-images';
const EB = 'btn bg-emerald-600', PB = 'btn bg-pink-600';
let sb, user, collab = [], ledgers = [], L = null, ex = [], sh = [], cf = [], tab = 'ex', fd = 'ALL', fcat = 'ALL', fp = 'ALL', sf = 'all', chart, ch, urls = {};

/* ---------- 工具 ---------- */
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const rate = () => +L.jpy_rate || 0;
const dc = () => L.display_currency;
const conv = (a, f, t) => f === t ? a : !rate() ? NaN : f === 'JPY' ? a * rate() : a / rate();
const fmt = (n, c) => (c === 'JPY' ? '¥' : 'NT$ ') + (c === 'JPY' ? Math.round(n) : Math.round(n * 100) / 100).toLocaleString('zh-TW');
const nick = () => (user.user_metadata && user.user_metadata.nickname) || user.email.split('@')[0];
const isOwner = () => L && L.owner_id === user.id;
const links = () => L.member_links || {};
const multi = () => collab.length > 1;                       // 有共編者才管控身分
const canConfirm = n => !multi() || links()[n] === user.id;
const fdt = t => new Date(t).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = 'fixed top-3 left-1/2 -translate-x-1/2 z-[60] text-xs px-3 py-2 rounded-lg text-white shadow-lg ' + (bad ? 'bg-red-500' : 'bg-emerald-600'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.add('hidden'), 2600); }
function openModal(title, body, icon = 'pen-to-square') {
  $('#sheet').innerHTML = `<button onclick="closeModal()" class="absolute top-3 right-3 text-slate-400 text-base"><i class="fa-solid fa-xmark"></i></button><h3 class="font-bold text-slate-900 mb-3 text-sm"><i class="fa-solid fa-${icon} text-amber-500 mr-1"></i>${title}</h3>${body}`;
  $('#modal').classList.remove('hidden');
}
function closeModal() { $('#modal').classList.add('hidden'); }
function hdr(t, s) { $('#h-title').textContent = t; $('#h-sub').textContent = s; $('#h-btns').classList.toggle('hidden', !user); $('#h-btns').classList.toggle('flex', !!user); }
function sumStr(list, div = 1) {            // 依結算幣別加總；SPLIT 則台幣、日圓各算各的
  if (dc() === 'SPLIT') {
    const p = ['TWD', 'JPY'].map(c => [c, list.filter(e => e.currency === c).reduce((s, e) => s + +e.amount, 0) / div]).filter(x => x[1] > 0).map(([c, n]) => fmt(n, c));
    return p.join(' ＋ ') || fmt(0, 'TWD');
  }
  const t = list.reduce((s, e) => s + conv(+e.amount, e.currency, dc()), 0) / div;
  return isNaN(t) ? '需設定匯率' : fmt(t, dc());
}
const banner = inner => `<div class="space-y-4 relative rounded-2xl p-4 overflow-hidden shadow-md" style="background-image:linear-gradient(to bottom,rgba(15,23,42,.8),rgba(15,23,42,.92)),linear-gradient(135deg,#d97706,#0f172a)">
  <div class="text-center space-y-2 relative z-10 pt-2 text-white"><div class="w-16 h-16 bg-gradient-to-tr from-amber-500 to-orange-400 text-white rounded-3xl mx-auto flex items-center justify-center text-2xl shadow-lg"><i class="fa-solid fa-wallet"></i></div>
  <h2 class="text-xl font-extrabold tracking-wide">帳本</h2><p class="text-xs text-slate-300">記錄每一筆花費，輕鬆分帳與結算</p></div>
  <div class="space-y-3 pt-2 relative z-10">${inner}</div></div>`;
const wcard = 'bg-white/95 backdrop-blur-sm border border-white/20 p-4 rounded-2xl shadow-sm text-slate-800';

/* ---------- 啟動與登入 ---------- */
function cfg() { const c = window.SUPABASE_CONFIG || {}; return { url: c.url || localStorage.getItem('sb_url') || '', key: c.key || localStorage.getItem('sb_key') || '' }; }
async function init() {
  const c = cfg();
  if (!c.url || !c.key) return viewConfig();
  sb = supabase.createClient(c.url, c.key);
  const { data } = await sb.auth.getSession();
  user = data.session && data.session.user;
  sb.auth.onAuthStateChange((_e, s) => { const u = s && s.user; if ((u && u.id) !== (user && user.id)) { user = u; user ? loadLedgers() : viewAuth(); } });
  user ? loadLedgers() : viewAuth();
}
function viewConfig() {
  $('#nav').classList.add('hidden'); hdr('帳本', '尚未連接雲端');
  $('#app').innerHTML = banner(`<form class="${wcard} space-y-2.5" onsubmit="saveCfg(event)"><h3 class="font-bold text-sm"><i class="fa-solid fa-cloud text-amber-500 mr-1"></i>連接 Supabase</h3>
  <p class="text-[10px] text-slate-500">依 supabase_setup.sql 開頭的步驟建立專案，再貼上 Project URL 與 publishable key。</p>
  <div><label class="lbl">Project URL</label><input name="u" class="in" placeholder="https://xxxx.supabase.co" required></div>
  <div><label class="lbl">publishable / anon key</label><input name="k" class="in" required></div><button class="${EB}">儲存並開始</button></form>`);
}
function saveCfg(e) { e.preventDefault(); const f = new FormData(e.target); localStorage.setItem('sb_url', f.get('u').trim()); localStorage.setItem('sb_key', f.get('k').trim()); location.reload(); }
function viewAuth(signup) {
  $('#nav').classList.add('hidden'); hdr('帳本', '請先登入');
  $('#app').innerHTML = banner(`<form class="${wcard} space-y-2.5" onsubmit="auth(event,${!!signup})"><h3 class="font-bold text-sm"><i class="fa-solid fa-user-circle text-emerald-600 mr-1"></i>${signup ? '註冊新帳號' : '登入雲端帳號'}</h3>
  ${signup ? '<div><label class="lbl">暱稱（分帳時顯示的名字）</label><input name="nick" class="in" required></div>' : ''}
  <div><label class="lbl">Email</label><input name="email" type="email" class="in" required></div>
  <div><label class="lbl">密碼（至少 6 碼）</label><input name="pw" type="password" minlength="6" class="in" required></div>
  <button class="${EB}">${signup ? '註冊' : '登入'}</button>
  <button type="button" class="w-full text-slate-500 underline" onclick="viewAuth(${!signup})">${signup ? '已有帳號？登入' : '沒有帳號？註冊'}</button></form>`);
}
async function auth(e, signup) {
  e.preventDefault(); const f = new FormData(e.target), email = f.get('email').trim(), password = f.get('pw');
  const r = signup ? await sb.auth.signUp({ email, password, options: { data: { nickname: f.get('nick').trim() } } }) : await sb.auth.signInWithPassword({ email, password });
  if (r.error) return toast(r.error.message, 1);
  if (signup && !r.data.session) { toast('註冊成功，請到信箱完成驗證後登入'); viewAuth(); }
}
function acctModal() {
  openModal('雲端帳號', `<div class="space-y-3"><div class="bg-slate-50 border border-slate-200 rounded-lg p-2.5"><p class="font-bold text-slate-800">${esc(nick())}</p><p class="text-[10px] text-slate-500">${esc(user.email)}</p></div>
  <p class="text-[10px] text-slate-500"><i class="fa-solid fa-circle text-emerald-500 text-[8px] mr-1"></i>已連線，資料會即時同步給共編者</p>
  ${standalone() ? '' : `<button class="btn bg-amber-500" onclick="installApp()"><i class="fa-solid fa-download mr-1"></i>安裝到主畫面</button>`}
  <button class="btn bg-slate-700" onclick="sb.auth.signOut();closeModal()">登出</button>
  <button class="w-full text-slate-400 underline text-[10px]" onclick="localStorage.removeItem('sb_url');localStorage.removeItem('sb_key');location.reload()">清除本機的 Supabase 設定</button></div>`, 'user-circle');
}

/* ---------- 帳本列表（首頁） ---------- */
async function loadLedgers() {
  const { data, error } = await sb.from('ledgers').select('*').order('created_at', { ascending: false });
  if (error) return toast(error.message, 1);
  ledgers = data; viewHome();
}
function goHome() { if (user) viewHome(); }
function viewHome() {
  L = null; if (ch) { sb.removeChannel(ch); ch = null; } $('#nav').classList.add('hidden'); hdr('帳本', '點擊返回首頁');
  $('#app').innerHTML = banner(`<div onclick="newLedgerModal()" class="bg-gradient-to-r from-amber-500 to-amber-600 text-white p-4 rounded-2xl shadow-md cursor-pointer active:scale-95 transition flex items-center justify-between">
    <div class="flex items-center space-x-3"><div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-lg"><i class="fa-solid fa-circle-plus"></i></div><div><h3 class="text-sm font-bold">新增帳本</h3><p class="text-[10px] text-amber-100">建立新帳本，開始記帳與分帳</p></div></div><i class="fa-solid fa-chevron-right text-xs text-amber-200"></i></div>
    <div class="flex items-center justify-between text-white pt-1"><span class="text-xs font-bold">我的帳本</span><span class="bg-emerald-100 text-emerald-700 text-xs px-2.5 py-0.5 rounded-full font-bold">${ledgers.length}</span></div>
    ${ledgers.map(l => `<div onclick="openLedger('${l.id}')" class="bg-white/95 backdrop-blur-sm border border-white/20 p-4 rounded-2xl shadow-sm cursor-pointer hover:bg-white transition flex items-center justify-between text-slate-800">
      <div class="flex items-center space-x-3 min-w-0"><div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg flex-shrink-0"><i class="fa-solid fa-book"></i></div>
      <div class="min-w-0"><h3 class="text-sm font-bold truncate">${esc(l.title)}</h3><p class="text-[10px] text-slate-500">${l.members.length} 位成員${+l.budget ? ' ・預算 ' + fmt(l.budget, 'TWD') : ''}${l.owner_id === user.id ? '' : ' ・共編'}</p></div></div><i class="fa-solid fa-chevron-right text-xs text-slate-300"></i></div>`).join('') || '<p class="text-center text-slate-300 text-[11px] py-3">還沒有帳本，點上方「新增帳本」開始</p>'}`);
}
function newLedgerModal() {
  openModal('新增帳本', `<form class="space-y-2.5" onsubmit="newLedger(event)"><div><label class="lbl">帳本名稱</label><input name="t" class="in" placeholder="例: 京都旅行 / 家用 / 室友" required></div>
  <div><label class="lbl">預算 (TWD)</label><input name="b" type="number" min="0" class="in" placeholder="留空 = 無預算"></div><button class="${EB}">建立帳本</button></form>`, 'circle-plus');
}
async function newLedger(e) {
  e.preventDefault(); const f = new FormData(e.target);
  const { data, error } = await sb.from('ledgers').insert({ title: f.get('t').trim(), budget: +f.get('b') || 0, members: [nick()], member_links: { [nick()]: user.id } }).select().single();
  if (error) return toast(error.message, 1);
  closeModal(); ledgers.unshift(data); openLedger(data.id);
}
async function openLedger(id) {
  L = ledgers.find(l => l.id === id); tab = 'ex'; fd = fcat = fp = 'ALL'; sf = 'all'; urls = {};
  if (ch) sb.removeChannel(ch);
  ch = sb.channel('l' + id); ['expenses', 'shopping_items', 'settlements'].forEach(t => ch.on('postgres_changes', { event: '*', schema: 'public', table: t, filter: 'ledger_id=eq.' + id }, load));
  ch.subscribe(); $('#nav').classList.remove('hidden'); await load();
}
async function load() {
  if (!L) return; const q = t => sb.from(t).select('*').eq('ledger_id', L.id);
  const [a, b, c, d, e] = await Promise.all([q('expenses').order('spent_on', { ascending: false }).order('created_at', { ascending: false }), q('shopping_items').order('created_at'), q('settlements'), sb.rpc('ledger_collaborators', { lid: L.id }), sb.from('ledgers').select('*').eq('id', L.id).maybeSingle()]);
  ex = a.data || []; sh = b.data || []; cf = c.data || []; collab = d.data || []; if (e.data) Object.assign(L, e.data);
  const need = sh.filter(i => i.image_path && !urls[i.image_path]).map(i => i.image_path);
  if (need.length) { const { data } = await sb.storage.from(BUCKET).createSignedUrls(need, 3600); (data || []).forEach(d => d.signedUrl && (urls[d.path] = d.signedUrl)); }
  render();
}
function setTab(t) { tab = t; render(); window.scrollTo(0, 0); }
function render() {
  if (!L) return; if (chart) { chart.destroy(); chart = null; }
  const tabs = [['home', 'house', '首頁'], ['ex', 'receipt', '花費'], ['sh', 'bag-shopping', '購物'], ['cfg', 'gear', '設定']];
  $('#nav').innerHTML = tabs.map(([k, i, n]) => `<button onclick="${k === 'home' ? 'goHome()' : `setTab('${k}')`}" class="flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === k ? 'text-amber-600' : 'text-slate-400'}"><i class="fa-solid fa-${i} text-base"></i><span>${n}</span></button>`).join('');
  hdr(L.title, `${L.members.length} 位成員${+L.budget ? ' ・預算 ' + fmt(L.budget, 'TWD') : ''}`);
  $('#app').innerHTML = { ex: viewEx, sh: viewSh, cfg: viewCfg }[tab]();
  if (tab === 'ex') drawChart(); if (tab === 'cfg') loadCollab();
}
const pageHead = (icon, color, title, btn) => `<div class="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200 shadow-sm"><h2 class="text-sm font-bold text-slate-900 flex items-center gap-1.5"><i class="fa-solid fa-${icon} ${color}"></i> ${title}</h2>${btn || ''}</div>`;

/* ---------- 花費 ---------- */
function filtered() { return ex.filter(e => (fd === 'ALL' || e.spent_on === fd) && (fcat === 'ALL' || e.category === fcat) && (fp === 'ALL' || e.payer === fp)); }
function fsel(v, name, all, o) { return `<select onchange="${v}=this.value;render()" class="bg-slate-50 border border-slate-200 rounded p-1 outline-none"><option value="ALL">${all}</option>${o.map(([k, t]) => `<option value="${esc(k)}" ${k === name ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`; }
function viewEx() {
  const list = filtered(), n = L.members.length || 1;
  let remain = '無預算';
  if (+L.budget) { const t = ex.reduce((s, e) => s + conv(+e.amount, e.currency, 'TWD'), 0); remain = isNaN(t) ? '需設定匯率' : fmt(L.budget - t, 'TWD'); }
  const dates = [...new Set(ex.map(e => e.spent_on))].sort(), cats = [...new Set([...Object.keys(CATS), ...ex.map(e => e.category)])], pays = [...new Set(ex.map(e => e.payer))].sort();
  return pageHead('receipt', 'text-emerald-600', '花費記帳與智慧分帳', `<button onclick="expForm()" class="sbtn bg-emerald-600"><i class="fa-solid fa-plus"></i> 新增</button>`) +
  `<div class="bg-white p-2.5 rounded-xl border border-slate-200 grid grid-cols-3 gap-1.5 text-[10px]">${fsel('fd', fd, '全部日期', dates.map(d => [d, d]))}${fsel('fcat', fcat, '全部分類', cats.map(k => [k, CATS[k] || k]))}${fsel('fp', fp, '全部付款', pays.map(p => [p, p]))}</div>
  <div class="grid grid-cols-3 gap-2">${[['總支出', sumStr(list), 'text-slate-800'], ['剩餘預算', remain, 'text-emerald-600'], ['人均分攤', sumStr(list, n), 'text-sky-600']].map(([a, b, c]) => `<div class="bg-white p-2 rounded-xl border border-slate-200 text-center shadow-sm"><p class="text-[9px] text-slate-500">${a}</p><p class="text-xs font-bold ${c} mt-0.5 break-words">${b}</p></div>`).join('')}</div>` +
  viewSt() +
  `<div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm space-y-2"><h4 class="text-xs font-bold text-slate-700">分類支出佔比</h4><div class="relative h-64 w-full flex items-center justify-center"><canvas id="pie"></canvas></div><div id="bars" class="space-y-1.5 text-[11px] pt-2"></div></div>

function debts(list, c) {                       // 逐筆拆成「誰欠誰」
  const out = [];
  list.forEach(e => {
    if (e.split_mode === 'self' || !e.payer) return;
    const t = Math.round(conv(+e.amount, e.currency, c) * 100); if (!(t > 0)) return;
    let p = [...new Set((e.participants || []).filter(Boolean))];
    if (e.split_mode === 'payer_excluded') p = p.filter(x => x !== e.payer); else if (!p.includes(e.payer)) p.push(e.payer);
    if (!p.length) return;
    const b = Math.floor(t / p.length); let r = t - b * p.length;
    p.forEach(n => { const s = b + (r-- > 0 ? 1 : 0); if (n !== e.payer) out.push({ from: n, to: e.payer, cents: s, title: e.title, orig: e }); });
  });
  return out;
}
function pairs(list, c) {                       // 兩人之間互相抵銷，只留淨額

}

  const { error } = id ? await sb.from('shopping_items').update(row).eq('id', id) : await sb.from('shopping_items').insert(row);
  if (error) { btn.disabled = false; return toast(error.message, 1); }
  if (old && old.expense_id) await sb.from('expenses').update({ title: row.name + (row.qty > 1 ? ' ×' + row.qty : ''), amount: row.amount, currency: row.currency }).eq('id', old.expense_id);   // 已購買項目：花費以購物項目為準
  closeModal(); load();
}
async function delSh(id) {
  const i = sh.find(x => x.id === id); if (!confirm(i.bought ? `刪除「${i.name}」？對應的花費也會一併刪除。` : `刪除「${i.name}」？`)) return;
  const { error } = await sb.from('shopping_items').delete().eq('id', id); if (error) return toast(error.message, 1);
  if (i.image_path) sb.storage.from(BUCKET).remove([i.image_path]); load();
}
async function setBought(id, el) {
  const i = sh.find(x => x.id === id);
  if (el.checked) {
    el.checked = false;
    if (!(+i.amount > 0)) return toast('金額必須大於 0 才能加入花費', 1);
    if (!L.members.length) return toast('請先到「設定」新增成員', 1);
    return openModal('買到了：' + esc(i.name), `<form class="space-y-2.5" onsubmit="buy(event,'${id}')"><p class="text-slate-500">將自動新增一筆 <b class="text-emerald-600">${fmt(i.amount, i.currency)}</b> 的花費</p>
    <div class="grid grid-cols-2 gap-2"><div><label class="lbl">購買日期</label><input name="date" type="date" class="in" value="${today()}" required></div><div><label class="lbl">實際付款人</label>${payerSel(nick())}</div></div>
    <div><label class="lbl">分帳模式</label><select name="mode" class="in bg-slate-50">${opts(MODES, 'self')}</select></div>
    <div><label class="lbl">參與分攤成員</label>${partsBox(L.members)}</div><button class="${EB}">確認並記帳</button></form>`, 'cart-shopping');
  }
  if (i.expense_id && !confirm('取消「已購買」會一併刪除對應的花費，確定嗎？')) return render();
  const { error } = i.expense_id ? await sb.from('expenses').delete().eq('id', i.expense_id) : await sb.from('shopping_items').update({ bought: false }).eq('id', id);
  if (error) toast(error.message, 1); load();
}
async function buy(ev, id) {
  ev.preventDefault(); const f = new FormData(ev.target), i = sh.find(x => x.id === id), mode = f.get('mode'), parts = f.getAll('p');
  if (i.currency === 'JPY' && dc() !== 'SPLIT' && !rate()) return toast('含日圓花費，請先到設定頁設定匯率', 1);
  if (mode !== 'self' && !parts.length) return toast('請至少勾選一位分攤成員', 1);
  const { data, error } = await sb.from('expenses').insert({ ledger_id: L.id, title: i.name + (+i.qty > 1 ? ' ×' + i.qty : ''), amount: i.amount, currency: i.currency, spent_on: f.get('date'), category: 'shopping', payer: f.get('payer'), split_mode: mode, participants: mode === 'self' ? [f.get('payer')] : parts, shopping_id: id }).select('id').single();
  if (error) return toast(error.message, 1);
  await sb.from('shopping_items').update({ bought: true, expense_id: data.id }).eq('id', id); closeModal(); load();
}

/* ---------- 設定 ---------- */
function viewCfg() {
  return pageHead('gear', 'text-slate-600', '帳本設定') +
  `<form class="card space-y-2.5" onsubmit="saveCfgLedger(event)">
  <div><label class="lbl">帳本名稱</label><input name="t" class="in" value="${esc(L.title)}" required></div>
  <div><label class="lbl">預算 (TWD，0 = 無預算)</label><input name="b" type="number" min="0" class="in" value="${L.budget}"></div>
  <div><label class="lbl">分帳成員 (逗號分隔，可包含沒有帳號的人)</label><input name="m" class="in" value="${esc(L.members.join(', '))}"></div>
  <div><label class="lbl">結算幣別</label><select name="d" class="in bg-slate-50"><option value="TWD" ${dc() === 'TWD' ? 'selected' : ''}>台幣</option><option value="JPY" ${dc() === 'JPY' ? 'selected' : ''}>日圓</option><option value="SPLIT" ${dc() === 'SPLIT' ? 'selected' : ''}>分開計算 (不換算)</option></select></div>
  <div><label class="lbl">匯率：1 日圓 = ? 台幣</label><div class="flex gap-2"><input name="r" type="number" step="any" min="0" class="in" value="${L.jpy_rate ?? ''}"><button type="button" onclick="autoRate(this.form)" class="px-2.5 border border-slate-200 rounded bg-slate-50 font-bold text-slate-600 whitespace-nowrap">自動取得</button></div></div>
  <button class="${EB}">儲存設定</button></form>
  <div class="card"><h4 class="text-xs font-bold text-slate-700 mb-2"><i class="fa-solid fa-user-group text-sky-600"></i> 共編者</h4><div id="collab" class="space-y-1 mb-2">載入中…</div>${isOwner() ? `<form class="flex gap-2" onsubmit="addCollab(event)"><input name="e" type="email" class="in" placeholder="對方註冊的 Email" required><button class="sbtn bg-sky-600 !px-3">邀請</button></form>` : ''}</div>
  <div class="card"><h4 class="text-xs font-bold text-slate-700 mb-1"><i class="fa-solid fa-link text-amber-600"></i> 成員與帳號對應</h4><p class="text-[10px] text-slate-500 mb-2">對應後，還款確認只有本人帳號能勾選自己的欄位。${isOwner() ? '' : '（僅擁有者可修改）'}</p>
  ${L.members.map((m, i) => `<div class="flex items-center justify-between gap-2 py-1"><span class="truncate font-bold">${esc(m)}</span><select class="border border-slate-200 rounded p-1 bg-slate-50 w-40" ${isOwner() ? '' : 'disabled'} onchange="setLink(${i},this.value)"><option value="">未對應</option>${collab.map(u => `<option value="${u.user_id}" ${links()[m] === u.user_id ? 'selected' : ''}>${esc(u.nickname || u.email)}</option>`).join('')}</select></div>`).join('') || '<p class="text-slate-400">尚無成員</p>'}</div>
  <div class="flex gap-2"><button onclick="exportCsv()" class="flex-1 py-2 rounded-lg border border-slate-200 bg-white font-bold text-slate-600"><i class="fa-solid fa-file-csv mr-1"></i>匯出 CSV</button>${isOwner() ? '<button onclick="delLedger()" class="flex-1 py-2 rounded-lg border border-red-200 bg-white font-bold text-red-500"><i class="fa-solid fa-trash mr-1"></i>刪除帳本</button>' : ''}</div>`;
}
async function saveCfgLedger(e) {
  e.preventDefault(); const f = new FormData(e.target);
  const row = { title: f.get('t').trim(), budget: +f.get('b') || 0, members: [...new Set(f.get('m').split(/[,，]/).map(s => s.trim()).filter(Boolean))], display_currency: f.get('d'), jpy_rate: +f.get('r') || null };
  if (isOwner()) row.member_links = Object.fromEntries(Object.entries(links()).filter(([n]) => row.members.includes(n)));
  const { data, error } = await sb.from('ledgers').update(row).eq('id', L.id).select().single();
  if (error) return toast(error.message, 1); Object.assign(L, data); toast('設定已儲存'); render();
}
async function autoRate(f) {
  try { const j = await (await fetch('https://open.er-api.com/v6/latest/JPY')).json(); if (!(j.rates && j.rates.TWD)) throw 0; f.r.value = j.rates.TWD; toast('已填入市場參考匯率，記得儲存'); }
  catch (e) { toast('取得匯率失敗，請手動輸入', 1); }
}
async function loadCollab() {
  const { data, error } = await sb.rpc('ledger_collaborators', { lid: L.id }), box = $('#collab'); if (!box) return;
  box.innerHTML = error ? esc(error.message) : data.map(u => `<div class="flex justify-between items-center bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5"><span>${esc(u.nickname || '')} <span class="text-slate-400">${esc(u.email)}</span></span>${isOwner() && u.user_id !== user.id ? `<button class="text-red-500" onclick="rmCollab('${u.user_id}')">移除</button>` : u.user_id === L.owner_id ? '<span class="text-[10px] text-amber-600 font-bold">擁有者</span>' : ''}</div>`).join('');
}
async function addCollab(e) { e.preventDefault(); const { error } = await sb.rpc('add_collaborator', { lid: L.id, mail: new FormData(e.target).get('e') }); if (error) return toast(error.message, 1); toast('已加入共編'); e.target.reset(); load(); }
async function rmCollab(uid) { if (!confirm('移除這位共編者？')) return; const { error } = await sb.rpc('remove_collaborator', { lid: L.id, uid }); if (error) return toast(error.message, 1); load(); }
async function delLedger() {
  if (prompt(`刪除後無法復原。請輸入帳本名稱「${L.title}」確認：`) !== L.title) return;
  const { data } = await sb.storage.from(BUCKET).list(L.id); if (data && data.length) await sb.storage.from(BUCKET).remove(data.map(f => L.id + '/' + f.name));
  const { error } = await sb.from('ledgers').delete().eq('id', L.id); if (error) return toast(error.message, 1);
  ledgers = ledgers.filter(l => l.id !== L.id); viewHome();
}
function exportCsv() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"', rows = [['日期', '項目', '分類', '金額', '幣別', '付款人', '分帳模式', '分攤成員']].concat(ex.map(e => [e.spent_on, e.title, CATS[e.category] || e.category, e.amount, e.currency, e.payer, MODES[e.split_mode], (e.participants || []).join('/')]));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' })); a.download = L.title + '.csv'; a.click();
}
/* ---------- 可安裝（PWA） ---------- */
let dip;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const showInstall = () => { if (!standalone()) $('#h-install').classList.remove('hidden'); };
addEventListener('beforeinstallprompt', e => { e.preventDefault(); dip = e; showInstall(); });
addEventListener('appinstalled', () => { dip = null; $('#h-install').classList.add('hidden'); closeModal(); toast('已安裝到主畫面'); });
if (isIOS) showInstall();
async function installApp() {
  if (dip) { dip.prompt(); await dip.userChoice; dip = null; $('#h-install').classList.add('hidden'); closeModal(); return; }
  const step = (n, t) => `<div class="flex gap-2 items-start"><span class="w-5 h-5 rounded-full bg-amber-500 text-white font-bold flex items-center justify-center flex-shrink-0">${n}</span><p class="pt-0.5">${t}</p></div>`;
  openModal('安裝到主畫面', `<div class="space-y-3 text-slate-700">${isIOS
    ? step(1, '用 <b>Safari</b> 開啟本頁（其他瀏覽器無法安裝）') + step(2, '點下方工具列的 <b>分享</b> 圖示 <i class="fa-solid fa-arrow-up-from-bracket text-sky-600"></i>') + step(3, '往下找到並點 <b>加入主畫面</b>，再按「新增」')
    : step(1, '用 <b>Chrome / Edge</b> 開啟本頁') + step(2, '點瀏覽器右上角選單 <b>⋮</b>') + step(3, '選 <b>安裝應用程式</b>（或「加到主畫面」）') + '<p class="text-[10px] text-slate-400">若選單裡找不到，請確認是用 https 網址開啟，並重新整理一次後再試。</p>'}</div>`, 'download');
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

init();
</script>
</body>
</html>
